name: Prepare custom frontend
description: Install the locked frontend dependencies and build shared packages
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - uses: pnpm/action-setup@v5
      with:
        version: '9.12.1'
        run_install: false
    - name: Locate pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ${{ steps.store.outputs.path }}
        key: custom-${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: custom-${{ runner.os }}-pnpm-
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build shared frontend packages
      shell: bash
      run: |
        pnpm --filter tauri-plugin-vpnservice-api build
        pnpm --filter easytier-frontend-lib build
