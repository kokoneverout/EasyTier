name: Prepare frontend
description: Install only the frontend toolchain and locked workspace dependencies
inputs:
  token:
    description: Token for protoc download
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - uses: pnpm/action-setup@v5
      with:
        version: '10.33.2'
        run_install: false
    - uses: arduino/setup-protoc@v3
      with:
        version: '35.1'
        repo-token: ${{ inputs.token }}
    - name: Locate pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ${{ steps.store.outputs.path }}
        key: custom-${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: custom-${{ runner.os }}-pnpm-
    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
